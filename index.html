<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Világtörténelmi Idővonal</title>
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-container">
            <div class="brand">
                <h1>THE LORE</h1>
                <div class="subtitle">Interaktív Világtörténelmi Idővonal</div>
            </div>

            <div class="controls-wrapper">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Keresés az események között...">
                </div>

                <div class="filter-group">
                    <select id="era-filter">
                        <option value="all">Minden korszak</option>
                    </select>

                    <select id="sort-filter">
                        <option value="asc">Időrendben (Elölről hátra)</option>
                        <option value="desc">Fordított sorrend (Újtól a régi felé)</option>
                    </select>

</body>

</html>
